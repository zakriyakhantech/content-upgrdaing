name: Push NameVerse Christian batch 008

on:
  push:
    paths:
      - '.github/workflows/push-nameverse-christian.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: names-upgraded-v3
          fetch-depth: 5

      - name: Fetch christian bundle
        run: |
          set -e
          ok=0
          for u in "https://litter.catbox.moe/suecf8.bundle" "https://x0.at/9fcK.bundle"; do
            echo "trying $u"
            for attempt in 1 2 3; do
              if curl -fsSL --retry 3 --retry-delay 2 "$u" -o /tmp/nv.bundle; then
                if git bundle verify /tmp/nv.bundle >/dev/null 2>&1; then ok=1; break 2; fi
                echo "bundle verify failed"
              else
                echo "curl failed (attempt $attempt)"
              fi
              sleep 3
            done
          done
          test "$ok" = "1"
          ls -lh /tmp/nv.bundle

      - name: Merge christian batch and push
        run: |
          set -e
          git config user.email "actions@github.com"
          git config user.name "NameVerse Bot"
          git fetch /tmp/nv.bundle HEAD:refs/remotes/bundle/christian
          git log --oneline -1 refs/remotes/bundle/christian
          git merge --no-edit refs/remotes/bundle/christian
          git push origin HEAD:names-upgraded-v3
          echo "PUSHED"
          git log --oneline -3
